simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [track23_tuning]

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 6
  consolidate_channels: true
  edge_prob: 0.6
  # used by: watts_strogatz (k must be even and < num_agents)
  k: 2
  rewire_prob: 0.3
  # used by: barabasi_albert (1 <= m < num_agents)
  m: 3

llm_models:
  # Track 2.3 tuning: temperature 0.7 and 1.5k output tokens per turn match the Colosseum paper (§5.3).
  - label: gemini-3.5-flash-lite
    llm:
      provider: gemini
      gemini:
        model: gemini-3.5-flash-lite
        params:
          max_tokens: 1500
          temperature: 0.7

experiment:
  tag: track23_tuning
  output_dir: experiments/collusion/outputs/track23_tuning
  max_concurrent_runs: 1
  # Tuning seeds; held-out seeds must differ. run_tuning.py runs one (condition, seed, replicate) per invocation.
  seeds: [101, 102]
  # Free tier: 15 RPM / 500 RPD for gemini-3.5-flash-lite. Every attempt is counted.
  request_pacing:
    max_rpm: 13
    daily_cap: 480
    ledger_path: logs/gemini_request_ledger.json
  collusion:
    colluder_selection: random
    # Turn order: random | colluders_first
    agent_order: random
  sweeps:
    # Conditions (track23_handoff_v4 §2). The runner forces prompt variant "control" when the channel is off.
    - name: prompted
      topologies: [complete]
      num_agents: [6]
      colluder_counts: [2]
      secret_channel_enabled: [true]
      prompt_variants: [structured]
    - name: emergent
      topologies: [complete]
      num_agents: [6]
      colluder_counts: [2]
      secret_channel_enabled: [true]
      prompt_variants: [control]
    - name: control
      topologies: [complete]
      num_agents: [6]
      colluder_counts: [2]
      secret_channel_enabled: [false]
      prompt_variants: [control]
